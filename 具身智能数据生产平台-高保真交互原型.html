<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>具身智能数据生产平台 · 高保真交互原型（离线单文件）</title>
<style>
/* ============================================================
   具身智能数据生产平台 · 设计令牌
   工业控制台方向：石墨深色底 + 中性冷蓝交互色 + 语义状态色
   无渐变、无毛玻璃、无胶囊按钮；圆角统一 3–6px，边框 1px 实线
   ============================================================ */

:root {
  /* ---- 表面层级 ---- */
  --bg:          #0a0c0f;
  --surface-0:   #0e1116;
  --surface-1:   #131720;
  --surface-2:   #191e28;
  --surface-3:   #20262f;
  --surface-inset: #080a0d;

  /* ---- 描边 ---- */
  --line:        #242b36;
  --line-soft:   #1a2029;
  --line-strong: #333c4a;

  /* ---- 文字 ---- */
  --text:        #e6eaf0;
  --text-2:      #98a3b2;
  --text-3:      #79828f;   /* 三级文字：与 surface-1 对比度 ≈4.6:1（小字达 AA） */
  --text-4:      #4a5361;
  --text-invert: #0a0c0f;

  /* ---- 交互主色（冷蓝，平面无渐变） ---- */
  --accent:      #4c8dff;
  --accent-hi:   #6ba0ff;
  --accent-dim:  #1b3358;
  --accent-line: #2b4f88;

  /* ---- 语义状态 ---- */
  --ok:        #34d399;   /* 通过 */
  --ok-dim:    #12352a;
  --warn:      #f4b740;   /* 有条件通过 / 注意 */
  --warn-dim:  #3a2f14;
  --danger:    #f2555a;   /* 不通过 / 驳回 */
  --danger-dim:#3a1a1d;
  --block:     #ff7a45;   /* 阻塞 */
  --block-dim: #3a2318;
  --review:    #4fa8d8;   /* 转复核 / 待判 */
  --review-dim:#122c3a;

  /* ---- 角色 / 域识别色（低饱和，仅作标记） ---- */
  --domain-a: #4c8dff;
  --domain-b: #4fa8d8;
  --domain-c: #7fc98b;
  --domain-d: #f4b740;
  --domain-e: #9d8bf0;
  --domain-f: #e08a6b;
  --domain-g: #7d8896;
  --domain-h: #d0a24f;

  /* ---- 排版 ---- */
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC",
               "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono",
               Consolas, Menlo, monospace;

  /* 字号阶梯（桌面端） */
  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-19: 19px;
  --fs-23: 23px;
  --fs-29: 29px;

  /* ---- 尺寸 ---- */
  --radius:    4px;
  --radius-sm: 3px;
  --radius-lg: 6px;
  --topbar-h:  52px;
  --nav-w:     216px;
  --nav-w-min: 56px;

  /* ---- 动效（仅状态变化，150–400ms） ---- */
  --ease: cubic-bezier(.2, .7, .3, 1);
  --t-fast:  150ms var(--ease);
  --t-base:  220ms var(--ease);
  --t-slow:  400ms var(--ease);

  --shadow-pop: 0 8px 28px rgba(0, 0, 0, .55);
  --grid-line:  color-mix(in srgb, var(--line) 52%, transparent);
  color-scheme: dark;
}

/* ============================================================
   明色主题（一键切换）
   ============================================================ */
[data-theme="light"] {
  --bg:          #f4f5f7;
  --surface-0:   #ffffff;
  --surface-1:   #fafbfc;
  --surface-2:   #f1f3f6;
  --surface-3:   #e7eaef;
  --surface-inset: #eef0f4;

  --line:        #dfe3ea;
  --line-soft:   #eaeef3;
  --line-strong: #c6cdd8;

  --text:        #14181f;
  --text-2:      #5a6473;
  --text-3:      #6a7280;   /* 三级文字：与 surface-1 对比度 ≈4.7:1（小字达 AA） */
  --text-4:      #a3abb7;
  --text-invert: #ffffff;

  --accent:      #2563eb;
  --accent-hi:   #1d4ed8;
  --accent-dim:  #dbe7fe;
  --accent-line: #b7cdfa;

  --ok:        #0f9d63;
  --ok-dim:    #dff3ea;
  --warn:      #b8791a;
  --warn-dim:  #fbf0d9;
  --danger:    #d93a40;
  --danger-dim:#fbe2e3;
  --block:     #d9601f;
  --block-dim: #fbe6dc;
  --review:    #1f7fa8;
  --review-dim:#dceff7;

  --domain-g: #5c6675;
  --shadow-pop: 0 8px 24px rgba(20, 24, 31, .14);
  --grid-line:  #e4e8ee;
  color-scheme: light;
}

/* ============================================================
   具身智能数据生产平台 · 基础与组件样式
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-13);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "cv05" 1;
  overflow: hidden;
}

:lang(zh) { line-height: 1.72; }
h1, h2, h3, h4, p, figure { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent-dim); color: var(--text); }

.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mono { letter-spacing: -.01em; }
.nowrap { white-space: nowrap; }
.pretty { text-wrap: pretty; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; }
.row-tight { display: flex; align-items: center; gap: 4px; }
.col { display: flex; flex-direction: column; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--text-2); }
.muted-3 { color: var(--text-3); }
.tiny { font-size: var(--fs-11); }
.small { font-size: var(--fs-12); }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hr { height: 1px; background: var(--line-soft); }

/* ---------- 滚动条 ---------- */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: 6px;
}
*::-webkit-scrollbar-thumb:hover { background-clip: content-box; background-color: var(--text-4); }
.scroll { overflow: auto; }

/* ============================================================
   应用外壳
   ============================================================ */
.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- 顶栏 ---------- */
.topbar {
  height: var(--topbar-h);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px 0 12px;
  background: var(--surface-0);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 40;
}
.brand { display: flex; align-items: center; gap: 9px; user-select: none; }
.brand-mark {
  width: 26px; height: 26px; flex: 0 0 auto;
  border: 1px solid var(--accent-line);
  border-radius: var(--radius);
  display: grid; place-items: center;
  color: var(--accent);
  background: var(--accent-dim);
}
.brand-text { line-height: 1.15; }
.brand-title { font-size: var(--fs-13); font-weight: 600; letter-spacing: .02em; }
.brand-sub { font-size: 10px; color: var(--text-3); letter-spacing: .09em; text-transform: uppercase; }

.topbar-sep { width: 1px; height: 22px; background: var(--line); flex: 0 0 auto; }

/* 端切换 */
.endswitch {
  display: flex; align-items: center; gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 2px;
}
.endswitch button {
  border: 0; background: transparent; color: var(--text-2);
  padding: 5px 12px; border-radius: var(--radius-sm);
  font-size: var(--fs-12); cursor: pointer; white-space: nowrap;
  transition: background var(--t-fast), color var(--t-fast);
}
.endswitch button:hover { color: var(--text); }
.endswitch button[aria-pressed="true"] {
  background: var(--surface-3); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}

/* 全局搜索 */
.gsearch {
  flex: 0 1 clamp(176px, 21vw, 340px);
  min-width: 0;
  display: flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-3);
  cursor: text;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.gsearch:hover { border-color: var(--line-strong); }
.gsearch:focus-within { border-color: var(--accent); background: var(--surface-1); }
/* 输入框必须能收缩，否则长查询会把顶栏顶出视口 */
.gsearch input {
  border: 0; background: transparent; outline: none;
  flex: 1; min-width: 0; color: var(--text); font-size: var(--fs-13);
  text-overflow: ellipsis;
}
.gsearch input::placeholder { color: var(--text-4); }

.iconbtn {
  border: 1px solid transparent; background: transparent; color: var(--text-2);
  width: 30px; height: 30px; border-radius: var(--radius);
  display: grid; place-items: center; cursor: pointer; position: relative;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.iconbtn:hover { background: var(--surface-2); color: var(--text); border-color: var(--line); }
.iconbtn[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.iconbtn .dot {
  position: absolute; top: 4px; right: 4px;
  min-width: 14px; height: 14px; padding: 0 3px;
  border-radius: 7px; background: var(--danger); color: #fff;
  font-size: 9px; line-height: 14px; text-align: center;
  font-family: var(--font-mono);
}
.iconbtn .dot.blue { background: var(--accent); }

/* ============================================================
   主体：左导航 + 内容
   ============================================================ */
.body { flex: 1 1 auto; display: flex; min-height: 0; }

.nav {
  flex: 0 0 auto;
  width: var(--nav-w);
  background: var(--surface-0);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  transition: width var(--t-base);
  overflow: hidden;
}
.nav.collapsed { width: var(--nav-w-min); }
.nav-scroll { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 8px 8px 16px; }
.nav-group-label {
  font-size: 10px; letter-spacing: .1em; color: var(--text-4);
  padding: 12px 8px 5px; text-transform: uppercase; white-space: nowrap;
}
.nav.collapsed .nav-group-label { opacity: 0; height: 16px; padding: 8px 0 0; }

.nav-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%; text-align: left;
  border: 0; background: transparent; color: var(--text-2);
  padding: 7px 9px; border-radius: var(--radius);
  cursor: pointer; position: relative;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav-item:hover { background: var(--surface-1); color: var(--text); }
.nav-item.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 5px; bottom: 5px;
  width: 2px; background: var(--accent); border-radius: 0 2px 2px 0;
}
.nav-item .nav-ico { flex: 0 0 auto; display: grid; place-items: center; width: 16px; height: 16px; }
.nav-item .nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav.collapsed .nav-label,
.nav.collapsed .nav-badge,
.nav.collapsed .nav-chev { display: none; }
.nav-badge {
  margin-left: auto; font-family: var(--font-mono); font-size: 10px;
  color: var(--text-3); background: var(--surface-2);
  padding: 0 5px; height: 16px; line-height: 16px; border-radius: 3px;
}
.nav-item.active .nav-badge { background: var(--surface-3); color: var(--text-2); }
.nav-chev { margin-left: auto; color: var(--text-4); display: grid; place-items: center; }

.nav-sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 6px; }
.nav-sub .nav-item { padding: 5px 9px 5px 34px; font-size: var(--fs-12); }
.nav-sub .nav-item.active::before { top: 3px; bottom: 3px; }
.nav-sub .nav-item .sub-dot {
  position: absolute; left: 17px; width: 4px; height: 4px; border-radius: 50%;
  background: var(--line-strong);
}
.nav-sub .nav-item.active .sub-dot { background: var(--accent); }

/* 内容区 */
.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

.pagehead {
  flex: 0 0 auto;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-0);
  display: flex; align-items: flex-start; gap: 16px;
}
.crumbs { display: flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: var(--text-3); margin-bottom: 5px; }
.crumbs button { border: 0; background: 0; padding: 0; color: var(--text-3); cursor: pointer; font-size: inherit; }
.crumbs button:hover { color: var(--accent); }
.crumbs .sep { color: var(--text-4); }
.crumbs .cur { color: var(--text-2); }
.page-title { font-size: var(--fs-19); font-weight: 600; letter-spacing: -.01em; }
.page-desc { font-size: var(--fs-12); color: var(--text-3); margin-top: 3px; max-width: 76ch; }
.page-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

.pagebody { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 20px 40px; }
.pagebody.flush { padding: 0; overflow: hidden; }

/* ============================================================
   通用块
   ============================================================ */
.panel {
  background: var(--surface-0);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; min-height: 42px;
  border-bottom: 1px solid var(--line-soft);
}
.panel-title { font-size: var(--fs-13); font-weight: 600; }
.panel-sub { font-size: var(--fs-11); color: var(--text-3); }
.panel-body { padding: 14px; }
.panel-body.flush { padding: 0; }
.panel-foot {
  padding: 10px 14px; border-top: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 8px; font-size: var(--fs-12);
  color: var(--text-3); background: var(--surface-1);
}
.panel-inset { background: var(--surface-inset); border-radius: var(--radius); }

.grid { display: grid; gap: 14px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: minmax(0,1fr) minmax(0,2fr); }
@media (max-width: 1320px) { .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ---------- 指标卡 ---------- */
.metric {
  padding: 13px 14px;
  border: 1px solid var(--line);
  background: var(--surface-0);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; text-align: left;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.metric:hover { border-color: var(--line-strong); background: var(--surface-1); }
.metric-label { font-size: var(--fs-12); color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.metric-value { font-size: var(--fs-29); font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.metric-value .unit { font-size: var(--fs-13); font-weight: 400; color: var(--text-3); margin-left: 3px; }
.metric-foot { font-size: var(--fs-11); color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.metric-spark { height: 26px; }

.delta { display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-mono); font-size: var(--fs-11); }
.delta.up { color: var(--ok); }
.delta.down { color: var(--danger); }
.delta.flat { color: var(--text-3); }

/* ---------- 数据飞轮闭环（六环节，末环回指首环） ---------- */
.flywheel { display: flex; flex-direction: column; gap: 10px; }
.flywheel-track { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
.fw-node {
  flex: 1 1 132px; min-width: 0;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-1); padding: 9px 10px;
  display: flex; flex-direction: column; gap: 3px;
  font: inherit; text-align: left; color: inherit;
}
.fw-node.clickable { cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); }
.fw-node.clickable:hover { border-color: var(--line-strong); background: var(--surface-2); }
.fw-node.clickable:hover .fw-k { color: var(--text-2); }
.fw-node.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.fw-node.t-warn {
  border-color: color-mix(in srgb, var(--warn) 38%, transparent);
  background: var(--warn-dim);
}
.fw-k { font-size: var(--fs-11); color: var(--text-3); }
.fw-v { font-size: var(--fs-13); font-weight: 600; letter-spacing: -.01em; }
.fw-node.t-warn .fw-v { color: var(--warn); }
.fw-note { font-size: 10.5px; color: var(--text-2); line-height: 1.5; }
.fw-arrow { align-self: center; color: var(--text-4); flex: 0 0 auto; }
.flywheel-loop {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-size: var(--fs-11); color: var(--text-3); line-height: 1.6;
  border-top: 1px dashed var(--line); padding-top: 9px;
}
.flywheel-loop svg { color: var(--text-4); flex: 0 0 auto; }

/* ---------- 能力指标（模型侧口径，与业务指标分列） ---------- */
.aikpi {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-1); padding: 10px 11px; min-width: 0;
  display: flex; flex-direction: column; gap: 6px;
}
.aikpi-k { font-size: var(--fs-11); color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.aikpi-v { font-size: var(--fs-19); font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.aikpi-v .unit { font-size: var(--fs-12); font-weight: 400; color: var(--text-3); margin-left: 3px; }
.aikpi-f { font-size: var(--fs-11); color: var(--text-2); line-height: 1.55; }
.aikpi .metric-spark { height: 18px; }

/* ---------- 状态标签 ---------- */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-11); line-height: 1; white-space: nowrap;
  border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text-2);
}
.tag .tdot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.tag.t-ok      { color: var(--ok);      background: var(--ok-dim);      border-color: color-mix(in srgb, var(--ok) 32%, transparent); }
.tag.t-warn    { color: var(--warn);    background: var(--warn-dim);    border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.tag.t-danger  { color: var(--danger);  background: var(--danger-dim);  border-color: color-mix(in srgb, var(--danger) 32%, transparent); }
.tag.t-block   { color: var(--block);   background: var(--block-dim);   border-color: color-mix(in srgb, var(--block) 32%, transparent); }
.tag.t-review  { color: var(--review);  background: var(--review-dim);  border-color: color-mix(in srgb, var(--review) 32%, transparent); }
.tag.t-accent  { color: var(--accent);  background: var(--accent-dim);  border-color: var(--accent-line); }
.tag.t-quiet   { color: var(--text-3);  background: transparent; border-color: var(--line); }
.tag.t-solid   { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border-radius: var(--radius);
  border: 1px solid var(--line-strong);
  background: var(--surface-2); color: var(--text);
  font-size: var(--fs-12); cursor: pointer; white-space: nowrap;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
.btn:hover { background: var(--surface-3); border-color: var(--text-4); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] {
  opacity: .42; cursor: not-allowed; transform: none;
  background: var(--surface-1); border-color: var(--line);
}
.btn-primary { background: var(--text); border-color: var(--text); color: var(--text-invert); font-weight: 600; }
.btn-primary:hover { background: #fff; border-color: #fff; }
[data-theme="light"] .btn-primary:hover { background: #000; border-color: #000; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-accent:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #05221a; font-weight: 600; }
.btn-ok:hover { filter: brightness(1.08); }
.btn-danger { background: transparent; border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }
.btn-danger:hover { background: var(--danger-dim); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line); color: var(--text); }
.btn-sm { height: 25px; padding: 0 9px; font-size: var(--fs-11); }
.btn-lg { height: 38px; padding: 0 18px; font-size: var(--fs-13); }
.btn-block { width: 100%; }

/* ---------- 表单 ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: var(--fs-12); color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.field-label .req { color: var(--danger); }
.input, .select, .textarea {
  height: 30px; padding: 0 9px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text); font-size: var(--fs-12); outline: none;
  transition: border-color var(--t-fast), background var(--t-fast);
  width: 100%;
}
.textarea { height: auto; padding: 8px 9px; resize: vertical; line-height: 1.65; font-family: inherit; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--line-strong); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); background: var(--surface-1); }
.input.mono { font-family: var(--font-mono); }
.input.invalid { border-color: var(--danger); }
.select { appearance: none; cursor: pointer; padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: right 12px center, right 7px center;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: var(--fs-12); color: var(--text-2); user-select: none; }
.check:hover { color: var(--text); }
.check input { appearance: none; width: 14px; height: 14px; margin: 0; flex: 0 0 auto;
  border: 1px solid var(--line-strong); border-radius: 3px; background: var(--surface-2); cursor: pointer; position: relative; transition: all var(--t-fast); }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after {
  content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px;
  border: solid #fff; border-width: 0 1.6px 1.6px 0; transform: rotate(42deg);
}
.check input[type="radio"] { border-radius: 50%; }
.check input[type="radio"]:checked::after { left: 3.5px; top: 3.5px; width: 5px; height: 5px; border: 0; border-radius: 50%; background: #fff; transform: none; }
.check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.switch { position: relative; display: inline-flex; width: 32px; height: 18px; flex: 0 0 auto; cursor: pointer; }
.switch input { position: absolute; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.switch .knob {
  position: absolute; inset: 0; border-radius: 9px; background: var(--surface-3);
  border: 1px solid var(--line-strong); transition: background var(--t-base), border-color var(--t-base);
}
.switch .knob::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--text-3); transition: transform var(--t-base), background var(--t-base);
}
.switch input:checked + .knob { background: var(--accent-dim); border-color: var(--accent); }
.switch input:checked + .knob::after { transform: translateX(14px); background: var(--accent); }

.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px;
  font-family: var(--font-mono); font-size: 10px; line-height: 1;
  background: var(--surface-3); border: 1px solid var(--line-strong);
  border-bottom-width: 2px; border-radius: 3px; color: var(--text-2);
}

/* ---------- 进度 ---------- */
.bar { height: 4px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width var(--t-slow); }
.bar.ok > i { background: var(--ok); }
.bar.warn > i { background: var(--warn); }
.bar.danger > i { background: var(--danger); }
.bar.thick { height: 6px; }
.bar-seg { display: flex; gap: 2px; }
.bar-seg > i { height: 6px; border-radius: 1px; flex: 1; background: var(--surface-3); }
.bar-seg > i.on { background: var(--ok); }
.bar-seg > i.warn { background: var(--warn); }
.bar-seg > i.off { background: var(--danger); }

/* ---------- 表格 ---------- */
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-12); }
.table th {
  text-align: left; font-weight: 500; color: var(--text-3);
  padding: 8px 10px; border-bottom: 1px solid var(--line);
  background: var(--surface-1); position: sticky; top: 0; z-index: 3;
  white-space: nowrap; font-size: var(--fs-11); letter-spacing: .02em;
}
.table th.sortable { cursor: pointer; user-select: none; }
.table th.sortable:hover { color: var(--text); }
.table th .sortcaret { color: var(--accent); margin-left: 3px; }
.table td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.table tbody tr { transition: background var(--t-fast); }
.table tbody tr:hover { background: var(--surface-1); }
.table tbody tr.selected { background: var(--accent-dim); }
.table tbody tr.clickable { cursor: pointer; }
.table td.num, .table th.num { text-align: right; font-family: var(--font-mono); }
.table.dense td { padding: 6px 10px; }
.table .rowdanger { box-shadow: inset 2px 0 0 var(--danger); }
.table .rowwarn { box-shadow: inset 2px 0 0 var(--warn); }

/* ---------- 空/错误/无权限态 ---------- */
.state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 48px 24px; text-align: center; color: var(--text-3);
}
.state-ico { width: 34px; height: 34px; display: grid; place-items: center; color: var(--text-4);
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-1); }
.state-title { font-size: var(--fs-13); color: var(--text-2); font-weight: 600; }
.state-desc { font-size: var(--fs-12); max-width: 46ch; }

.skel { background: var(--surface-2); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
.skel::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text-4) 22%, transparent), transparent);
  transform: translateX(-100%); animation: skel 1.3s infinite;
}
@keyframes skel { to { transform: translateX(100%); } }

/* ---------- 轻提示 ---------- */
.toasts {
  position: fixed; right: 20px; bottom: 20px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  min-width: 268px; max-width: 380px;
  background: var(--surface-2); border: 1px solid var(--line-strong);
  border-left-width: 3px;
  border-radius: var(--radius); padding: 10px 12px;
  box-shadow: var(--shadow-pop);
  display: flex; gap: 9px; align-items: flex-start;
  animation: toastIn var(--t-base) both;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
.toast.ok { border-left-color: var(--ok); }
.toast.warn { border-left-color: var(--warn); }
.toast.danger { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--accent); }
.toast-title { font-size: var(--fs-12); font-weight: 600; }
.toast-desc { font-size: var(--fs-11); color: var(--text-3); margin-top: 2px; line-height: 1.6; }
.toast .undo { color: var(--accent); cursor: pointer; font-size: var(--fs-11); }
.toast .undo:hover { text-decoration: underline; }

/* ---------- 弹层 ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 150;
  background: color-mix(in srgb, #000 62%, transparent);
  display: grid; place-items: center; padding: 24px;
  animation: fade var(--t-fast) both;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  width: min(640px, 100%);
  max-height: 84vh; overflow: auto;
  background: var(--surface-1);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop);
  animation: pop var(--t-base) both;
}
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.99); } }
.modal-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
.modal-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--surface-0); }
.warnbox {
  border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent);
  background: var(--warn-dim); color: var(--warn);
  border-radius: var(--radius); padding: 10px 12px; font-size: var(--fs-12); line-height: 1.7;
}
.warnbox.danger { border-color: color-mix(in srgb, var(--danger) 34%, transparent); background: var(--danger-dim); color: var(--danger); }
.warnbox.info { border-color: var(--accent-line); background: var(--accent-dim); color: var(--accent-hi); }

/* ---------- 抽屉 ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 160;
  width: min(560px, 92vw);
  background: var(--surface-1); border-left: 1px solid var(--line-strong);
  display: flex; flex-direction: column; box-shadow: var(--shadow-pop);
  animation: slideIn var(--t-base) both;
}
@keyframes slideIn { from { transform: translateX(18px); opacity: .4; } }
.drawer-head { padding: 13px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer-body { flex: 1 1 auto; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.drawer-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

/* ============================================================
   设备外壳（采集端 / 客户门户）
   ============================================================ */
.stage {
  flex: 1 1 auto; min-height: 0; overflow: auto;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 26px 20px 60px;
  /* 工程蓝图网格：32px 方格，取自测量纸/CAD 制图惯例，非装饰性渐变 */
  background-color: var(--surface-inset);
  background-image:
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 32px 32px;
}
.stage.center { align-items: center; }

.phone {
  width: 392px; height: 812px; flex: 0 0 auto;
  border: 1px solid var(--line-strong);
  border-radius: 34px;
  background: var(--surface-0);
  padding: 10px;
  position: relative;
  box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 0 0 1px var(--line-soft);
}
.phone::before {
  content: ""; position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  width: 74px; height: 6px; border-radius: 3px; background: var(--surface-3); z-index: 5;
}
.phone-screen {
  height: 100%; border-radius: 25px; overflow: hidden;
  background: var(--bg); display: flex; flex-direction: column; position: relative;
}
.phone-caption {
  margin-top: 14px; text-align: center; font-size: var(--fs-11); color: var(--text-3);
}

.window {
  width: min(1240px, 100%); flex: 0 0 auto;
  border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
  overflow: hidden; background: var(--surface-0);
  box-shadow: 0 24px 60px rgba(0,0,0,.45);
}
.window-bar {
  height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.window-dots { display: flex; gap: 6px; }
.window-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
.window-url {
  flex: 1; height: 22px; border-radius: 3px; background: var(--surface-inset);
  border: 1px solid var(--line); display: flex; align-items: center; gap: 6px;
  padding: 0 9px; font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
}
.window-body { height: 700px; overflow: auto; background: var(--bg); }

/* ============================================================
   采集端（移动端）
   ============================================================ */
.m-app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.m-statusbar {
  flex: 0 0 auto; height: 26px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; font-family: var(--font-mono); font-size: 10px; color: var(--text-3);
}
.m-topbar {
  flex: 0 0 auto; padding: 6px 14px 12px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--line-soft);
}
.m-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 14px 150px; display: flex; flex-direction: column; gap: 14px; }
.m-title { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.m-sub { font-size: 12px; color: var(--text-3); }
.m-card {
  border: 1px solid var(--line); background: var(--surface-0);
  border-radius: var(--radius-lg); padding: 14px;
}
.m-card.flat { background: var(--surface-1); }
.m-card.active { border-color: var(--accent-line); background: var(--surface-1); }
.m-tabbar {
  flex: 0 0 auto; height: 62px; display: flex; align-items: stretch;
  border-top: 1px solid var(--line); background: var(--surface-0);
}
.m-tab {
  flex: 1; border: 0; background: transparent; color: var(--text-3); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 10px; transition: color var(--t-fast);
}
.m-tab.active { color: var(--accent); }
.m-bigbtn {
  height: 64px; border-radius: var(--radius-lg); border: 0; cursor: pointer;
  font-size: 17px; font-weight: 600; letter-spacing: .02em;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: filter var(--t-fast), transform var(--t-fast);
}
.m-bigbtn:active { transform: scale(.985); }
.m-bigbtn.rec { background: var(--danger); color: #fff; }
.m-bigbtn.stop { background: var(--text); color: var(--text-invert); }
.m-bigbtn.done { background: var(--ok); color: #05221a; }
.m-bigbtn:disabled { opacity: .45; cursor: not-allowed; }
.m-stepnum {
  width: 22px; height: 22px; flex: 0 0 auto; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px;
  border: 1px solid var(--line-strong); color: var(--text-3);
}
.m-step.done .m-stepnum { background: var(--ok); border-color: var(--ok); color: #05221a; }
.m-step.active .m-stepnum { background: var(--accent); border-color: var(--accent); color: #fff; }
.m-step { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; }
.m-step:hover { background: var(--surface-1); }
.m-step.active { background: var(--surface-2); border-color: var(--accent-line); }
.m-step.done .m-step-name { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-4); }

/* 质量灯 */
.qlight {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface-1);
}
.qlight .lamp {
  width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto;
  box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 16%, transparent);
  background: currentColor; transition: color var(--t-base);
}
.qlight.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 34%, transparent); background: var(--ok-dim); }
.qlight.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 34%, transparent); background: var(--warn-dim); }
.qlight.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 34%, transparent); background: var(--danger-dim); }
.qlight .qtext { color: var(--text); font-size: var(--fs-12); }
.qlight .qnum { font-family: var(--font-mono); font-size: var(--fs-11); }

.qrow { display: grid; grid-template-columns: 1fr 62px; gap: 10px; align-items: center; }
.qrow .qname { font-size: var(--fs-11); color: var(--text-3); }
.qrow .qval { font-family: var(--font-mono); font-size: var(--fs-12); text-align: right; }

@keyframes pulseRec { 50% { opacity: .35; } }
.recdot { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: pulseRec 1.1s infinite; }
@keyframes flagPop { from { transform: translateY(-4px); opacity: 0; } }

/* 主操作条：固定在屏幕底部、tab bar 之上，不随滚动移动 */
.m-actionbar {
  position: absolute; left: 0; right: 0; bottom: 62px; z-index: 8;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px 12px;
  background: var(--surface-0);
  border-top: 1px solid var(--line);
  box-shadow: 0 -10px 24px color-mix(in srgb, #000 45%, transparent);
}

/* ============================================================
   播放器 / 多模态视图
   ============================================================ */
.player { background: var(--surface-inset); border-radius: var(--radius); overflow: hidden; position: relative; }
.player-grid { display: grid; gap: 4px; background: var(--surface-inset); }
.player-grid.n1 { grid-template-columns: 1fr; }
.player-grid.n2 { grid-template-columns: 1fr 1fr; }
.player-grid.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.viewtile { position: relative; overflow: hidden; background: #05070a; }
.viewtile svg { display: block; width: 100%; height: 100%; }
.viewtile .vtlabel {
  position: absolute; top: 6px; left: 6px; display: flex; align-items: center; gap: 5px;
  background: color-mix(in srgb, #000 62%, transparent);
  border: 1px solid rgba(255,255,255,.14); border-radius: 3px;
  padding: 1px 6px; font-size: 10px; color: #d6dce5;
  font-family: var(--font-mono);
}
.viewtile .vtlabel .lid { width: 5px; height: 5px; border-radius: 50%; }
.viewtile.main { outline: 1px solid var(--accent); outline-offset: -1px; }
.viewtile .vtbadge {
  position: absolute; right: 6px; top: 6px;
  background: color-mix(in srgb, #000 62%, transparent); border: 1px solid rgba(255,255,255,.14);
  border-radius: 3px; padding: 1px 6px; font-size: 10px; color: #d6dce5; font-family: var(--font-mono);
}
.viewtile .vtflag {
  position: absolute; bottom: 6px; left: 6px; right: 6px;
  display: flex; gap: 4px; flex-wrap: wrap;
}

.transport {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; background: var(--surface-1); border-top: 1px solid var(--line-soft);
}
.transport .tc { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-2); }

.timeline { padding: 10px 12px 12px; background: var(--surface-0); border-top: 1px solid var(--line-soft); }
.tl-ruler { position: relative; height: 18px; margin-bottom: 4px; }
.tl-ruler span { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10px; color: var(--text-4); }
.tl-ruler i { position: absolute; top: 15px; width: 1px; height: 4px; background: var(--line); }

.track { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; height: 26px; }
.track + .track { margin-top: 3px; }
.track-label {
  font-size: var(--fs-11); color: var(--text-3); display: flex; align-items: center; gap: 6px;
  border: 0; background: 0; padding: 0; cursor: pointer; text-align: left; width: 100%;
}
.track-label:hover { color: var(--text); }
.track-label .chev { transition: transform var(--t-fast); color: var(--text-4); }
.track.folded .track-label .chev { transform: rotate(-90deg); }
.track-lane {
  position: relative; height: 22px; border-radius: 3px;
  background: var(--surface-inset); border: 1px solid var(--line-soft);
  cursor: crosshair;
}
.seg {
  position: absolute; top: 2px; bottom: 2px;
  border-radius: 3px; border: 1px solid;
  display: flex; align-items: center; padding: 0 6px;
  font-size: 10px; white-space: nowrap; overflow: hidden;
  cursor: grab; user-select: none;
}
.seg.ghost { border-style: dashed; opacity: .62; }
.seg.act { background: color-mix(in srgb, var(--domain-c) 22%, transparent); border-color: var(--domain-c); color: #cdebd4; }
.seg.sub { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); color: #cfe1ff; }
.seg.ins { background: color-mix(in srgb, var(--domain-e) 24%, transparent); border-color: var(--domain-e); color: #ded6ff; }
.seg.con { background: color-mix(in srgb, var(--warn) 22%, transparent); border-color: var(--warn); color: #ffe6b4; }
.seg.sel { box-shadow: 0 0 0 2px var(--text); }
.seg .handle { position: absolute; top: 0; bottom: 0; width: 6px; cursor: ew-resize; }
.seg .handle.l { left: -1px; } .seg .handle.r { right: -1px; }

.playhead {
  position: absolute; top: -14px; bottom: -14px; width: 1px; background: var(--accent); z-index: 6; pointer-events: none;
}
.playhead::before {
  content: ""; position: absolute; top: 0; left: -4px; width: 9px; height: 7px;
  background: var(--accent); clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.flagmark { position: absolute; top: -9px; width: 8px; height: 8px; transform: translateX(-50%) rotate(45deg); z-index: 5; cursor: pointer; }
.flagmark.danger { background: var(--danger); }
.flagmark.warn { background: var(--warn); }

.annopin {
  position: absolute; top: -3px; width: 12px; height: 12px; border-radius: 50%;
  border: 1px solid var(--surface-0); z-index: 5; cursor: pointer;
}
.annopin.review { background: var(--review); }
.annopin.warn { background: var(--warn); }

/* 置信度色带 */
.confband { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 1px; }
.confband i { flex: 1; }

/* 叠加层开关 */
.overlay-sw { display: flex; flex-wrap: wrap; gap: 6px; }
.overlay-sw .ov {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-1); color: var(--text-3); font-size: var(--fs-11);
  transition: all var(--t-fast);
}
.overlay-sw .ov:hover { color: var(--text); border-color: var(--line-strong); }
.overlay-sw .ov.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-dim); }

/* 元数据 / 定义列表 */
.dl { display: grid; grid-template-columns: auto 1fr; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; }
.dl > dt, .dl > dd { background: var(--surface-0); padding: 7px 10px; margin: 0; font-size: var(--fs-12); }
.dl > dt { color: var(--text-3); white-space: nowrap; }
.dl > dd { color: var(--text); }

/* 代码/编码 chip */
.codechip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 11px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 3px; padding: 1px 6px; color: var(--text-2);
}

/* 代码块（开放接口接入示例） */
.codeblock {
  margin: 0; padding: 12px 14px;
  background: var(--surface-inset);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: auto; max-height: 380px;
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.75;
  color: var(--text-2); white-space: pre; tab-size: 2;
}

/* 时间线（任务详情） */
.tlflow { display: flex; flex-direction: column; }
.tlflow-node { display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
.tlflow-node + .tlflow-node { margin-top: 0; }
.tlflow-rail { display: flex; flex-direction: column; align-items: center; }
.tlflow-dot {
  width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px;
  border: 1px solid var(--line-strong); background: var(--surface-1); color: var(--text-3);
}
.tlflow-node.done .tlflow-dot { background: var(--ok-dim); border-color: var(--ok); color: var(--ok); }
.tlflow-node.active .tlflow-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.tlflow-node.blocked .tlflow-dot { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
.tlflow-node.insert .tlflow-dot { background: var(--warn-dim); border-color: var(--warn); color: var(--warn); transform: rotate(45deg); }
.tlflow-line { flex: 1 1 auto; width: 1px; background: var(--line); min-height: 18px; }
.tlflow-body { padding-bottom: 16px; }
.tlflow-node:last-child .tlflow-body { padding-bottom: 0; }

/* 风险列表 */
.risk {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: start;
  padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-0); transition: border-color var(--t-fast);
}
.risk:hover { border-color: var(--line-strong); }
.risk > .rk { width: 3px; border-radius: 2px; background: var(--text-4); align-self: stretch; }
.risk.lv-danger > .rk { background: var(--danger); }
.risk.lv-warn > .rk { background: var(--warn); }
.risk.lv-info > .rk { background: var(--review); }
.risk-title { font-size: var(--fs-12); font-weight: 600; }
.risk-desc { font-size: var(--fs-11); color: var(--text-3); margin-top: 2px; line-height: 1.6; }
.risk-act { font-size: var(--fs-11); color: var(--text-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }

/* 分布直方图 */
.hist { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
.hist i { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; opacity: .82; min-height: 2px; transition: height var(--t-slow), opacity var(--t-fast); }
.hist i:hover { opacity: 1; }
.hist i.dim { background: var(--line-strong); opacity: 1; }
.hist-x { display: flex; gap: 3px; margin-top: 5px; }
.hist-x span { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 9px; color: var(--text-4); }

/* 流水线 */
.pipe { display: flex; flex-direction: column; gap: 6px; }
.pipe-step {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-1); cursor: grab;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.pipe-step:hover { border-color: var(--line-strong); }
.pipe-step.dragging { opacity: .4; }
.pipe-step.over { border-color: var(--accent); background: var(--accent-dim); }
.pipe-grip { color: var(--text-4); cursor: grab; }
.pipe-idx { font-family: var(--font-mono); font-size: 10px; color: var(--text-4); width: 14px; }

/* 选中高亮 */
.hl { animation: hl 1.4s var(--t-slow); }
@keyframes hl { 0%, 30% { background: var(--accent-dim); } 100% { background: transparent; } }
.blinkline { box-shadow: 0 0 0 1px var(--accent) inset; border-radius: var(--radius-sm); }

/* 演示动线面板 */
.fabs { position: fixed; right: 18px; bottom: 18px; z-index: 120; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.fabs-panel {
  width: 300px; background: var(--surface-1); border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); overflow: hidden;
  animation: pop var(--t-base) both;
}
.flowitem {
  display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start;
  padding: 8px 12px; border: 0; background: transparent; color: inherit;
  text-align: left; cursor: pointer; width: 100%;
  border-bottom: 1px solid var(--line-soft);
  transition: background var(--t-fast);
}
.flowitem:hover { background: var(--surface-2); }
.flowitem.active { background: var(--accent-dim); }
.flowitem .fid {
  font-family: var(--font-mono); font-size: 10px; color: var(--accent);
  border: 1px solid var(--accent-line); border-radius: 3px; text-align: center;
  background: var(--accent-dim); height: 17px; line-height: 16px;
}
.flowitem .ft { font-size: var(--fs-12); font-weight: 600; }
.flowitem .fd { font-size: 10.5px; color: var(--text-3); margin-top: 1px; line-height: 1.55; }

.fab-toggle {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--line-strong);
  color: var(--text-2); cursor: pointer; display: grid; place-items: center;
  box-shadow: var(--shadow-pop);
  transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
.fab-toggle:hover { background: var(--surface-3); color: var(--text); transform: translateY(-1px); }

/* 键盘提示条 */
.keybar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 7px 14px; border-top: 1px solid var(--line-soft);
  background: var(--surface-1); font-size: var(--fs-11); color: var(--text-3);
}
.keybar b { color: var(--text-2); font-weight: 500; }

/* 危险区 */
.dangerzone { border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); border-radius: var(--radius-lg); background: color-mix(in srgb, var(--danger) 6%, transparent); }
.dangerzone .panel-head { border-bottom-color: color-mix(in srgb, var(--danger) 22%, transparent); }

/* 三栏工作台 */
.wb { display: grid; height: 100%; min-height: 0; }
.wb-3 { grid-template-columns: 268px minmax(0, 1fr) 316px; }
.wb-3w { grid-template-columns: 300px minmax(0, 1fr) 340px; }
.wb-2 { grid-template-columns: minmax(0, 1fr) 368px; }
.wb-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface-0); }
.wb-col:last-child { border-right: 0; }
.wb-col.scrollable { overflow: auto; }
.wb-head {
  flex: 0 0 auto; padding: 9px 12px; border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 8px; min-height: 40px; background: var(--surface-0);
}
.wb-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
.wb-foot { flex: 0 0 auto; border-top: 1px solid var(--line-soft); }

.listitem {
  display: block; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--line-soft);
  background: transparent; color: inherit; padding: 9px 12px; cursor: pointer;
  position: relative; transition: background var(--t-fast);
}
.listitem:hover { background: var(--surface-1); }
.listitem.active { background: var(--surface-2); }
.listitem.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }

/* 原因码选择 */
.rc-group { display: flex; flex-direction: column; gap: 3px; }
.rc-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-1); cursor: pointer; text-align: left; width: 100%;
  transition: all var(--t-fast);
}
.rc-item:hover { border-color: var(--line-strong); background: var(--surface-2); }
.rc-item.on { border-color: var(--danger); background: var(--danger-dim); }
.rc-code { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); flex: 0 0 auto; padding-top: 1px; }
.rc-item.on .rc-code { color: var(--danger); }

/* 评分 */
.score { display: flex; gap: 5px; }
.score button {
  width: 38px; height: 34px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-2);
  font-family: var(--font-mono); font-size: var(--fs-13); position: relative;
  transition: all var(--t-fast);
}
.score button:hover { color: var(--text); border-color: var(--text-4); }
.score button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.score button .k { position: absolute; bottom: 1px; right: 3px; font-size: 8px; opacity: .6; }

/* 详情两栏 */
.detail-split { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 14px; align-items: start; }

/* ============================================================
   响应式 · 桌面 → 平板 → 手机
   断点：1440（密排收窄）· 1180（多栏堆叠）· 900（导航转抽屉）· 600（手机）
   原则：不改变信息层级，只改排布与密度；任何断点下都不出现整页横向滚动
   ============================================================ */

/* ---------- 顶栏汉堡：默认隐藏，仅窄屏出现 ---------- */
.topbar-burger {
  display: none;
  width: 34px; height: 34px; flex: 0 0 auto;
  align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-2); color: var(--text-2); cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
}
.topbar-burger:hover { background: var(--surface-3); color: var(--text); }
.nav-scrim { display: none; }

/* 横向溢出兜底 */
.main, .pagebody, .wb-col, .wb-body { max-width: 100%; }
.brand { min-width: 0; }
.brand-text { min-width: 0; }
.brand-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

/* ========== ≤1440px：密排收窄，固定列宽压缩 ========== */
@media (max-width: 1440px) {
  :root { --nav-w: 196px; }
  .wb-3  { grid-template-columns: 236px minmax(0,1fr) 292px; }
  .wb-3w { grid-template-columns: 260px minmax(0,1fr) 308px; }
  .wb-2  { grid-template-columns: minmax(0,1fr) 336px; }
}

/* ========== ≤1180px：多栏改单列堆叠，页面整体滚动 ========== */
@media (max-width: 1180px) {
  .g-4, .g-3, .g-2-1, .g-1-2 { grid-template-columns: minmax(0,1fr); }
  .detail-split { grid-template-columns: minmax(0,1fr); }

  .pagebody.flush { overflow: auto; padding: 0 0 32px; }
  .wb {
    height: auto; min-height: 0;
    display: flex; flex-direction: column;
    gap: 14px; padding: 14px 16px 0;
  }
  .wb-col {
    border-right: 0; border: 1px solid var(--line);
    border-radius: var(--radius-lg); background: var(--surface-0);
    /* 堆叠时按内容取高：不可被 flex 压缩，否则播放器等定高区会被裁掉 */
    flex: 0 0 auto;
    overflow: hidden;
  }
  .wb-col.scrollable { overflow: visible; }
  .wb-body { overflow: auto; max-height: none; }
  /* 表格改为容器内横向滚动，而不是把列挤到不可读 */
  .table { min-width: 620px; }
  .wb-head { background: var(--surface-0); }
  /* 顶栏搜索在中等宽度先收窄，避免把端切换与选择篮顶出视口 */
  .gsearch { flex: 0 1 200px; }
}

/* ========== ≤900px：导航转覆盖式抽屉 + 顶栏精简 ========== */
@media (max-width: 900px) {
  .topbar-burger { display: inline-flex; }
  .topbar { gap: 8px; padding: 0 10px; }
  .topbar-sep { display: none; }
  .gsearch { display: none; }
  .brand-sub { display: none; }
  .brand-title { max-width: 132px; }

  .nav {
    position: fixed; top: var(--topbar-h); bottom: 0; left: 0; z-index: 70;
    width: 270px; max-width: 84vw;
    transform: translateX(-101%);
    transition: transform var(--t-base);
    box-shadow: var(--shadow-pop);
  }
  .nav.open { transform: translateX(0); }
  /* 抽屉模式忽略「收起导航」，始终展开 */
  .nav.collapsed { width: 270px; }
  .nav.collapsed .nav-label { display: inline; }
  .nav.collapsed .nav-badge { display: inline-flex; }
  .nav.collapsed .nav-chev { display: grid; }
  .nav.collapsed .nav-group-label { opacity: 1; height: auto; padding: 8px 10px 4px; }
  .nav .nav-scroll { padding: 10px 10px 20px; }
  .nav > div:last-child { display: none; }

  .nav-scrim {
    display: block; position: fixed; inset: var(--topbar-h) 0 0 0; z-index: 65;
    background: color-mix(in srgb, #000 58%, transparent);
    animation: fade var(--t-fast) both;
  }

  .pagehead { padding: 12px 14px 10px; gap: 12px; }
  .page-title { font-size: var(--fs-16); }
  .pagebody { padding: 14px 14px 40px; }
  .metric-value { font-size: var(--fs-23); }

  /* 播放器控制条：窄屏换行，避免控件被推出视口 */
  .transport { flex-wrap: wrap; row-gap: 8px; }
  .transport input[type="range"] { min-width: 140px; }
}

/* ========== ≤820px：顶栏次要入口收起，避免被裁切而不可达 ========== */
@media (max-width: 820px) {
  .topbar { gap: 6px; padding: 0 8px; }
  .topbar-proj, .topbar-info { display: none; }
}

/* ========== ≤600px：手机端 ========== */
@media (max-width: 600px) {
  :root { --topbar-h: 48px; }

  /* 顶栏只留可达的必要项：文字标签转图标，避免溢出后被裁掉 */
  .brand-text, .topbar-avatar { display: none; }
  .endswitch button, .topbar-basket { font-size: 0; }
  .endswitch button { padding: 6px 10px; }
  .topbar-basket { padding: 0 9px; }
  .topbar-basket .basket-label { display: none; }
  .endswitch button svg, .topbar-basket svg { display: block; }

  /* 页头改为两行，操作按钮占满一行 */
  .pagehead { flex-direction: column; align-items: stretch; gap: 10px; }
  .page-title { font-size: var(--fs-14); }
  .page-desc {
    font-size: var(--fs-11); margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .page-actions { margin-left: 0; flex-wrap: wrap; }
  .pagebody { padding: 12px 12px 32px; }
  .pagebody.flush { padding-bottom: 24px; }
  .wb { padding: 10px 10px 0; gap: 10px; }
  .grid { gap: 10px; }
  /* 飞轮在窄屏转两列，去掉连线箭头避免换行错位 */
  .fw-node { flex: 1 1 calc(50% - 3px); }
  .fw-arrow { display: none; }

  /* 采集端 / 客户门户：去掉设备外壳，直接铺满 */
  .stage { padding: 0; align-items: stretch; background-image: none; }
  .phone {
    width: 100%; height: calc(100dvh - var(--topbar-h));
    border: 0; border-radius: 0; padding: 0; box-shadow: none;
  }
  .phone::before { display: none; }
  .phone-screen { border-radius: 0; }
  .phone-caption, .window-dots, .window-url { display: none; }
  .window {
    width: 100%; border: 0; border-radius: 0; box-shadow: none;
  }
  .window-bar { display: none; }
  .window-body { height: auto; min-height: calc(100dvh - var(--topbar-h)); }

  /* 浮动面板与弹层贴近屏幕边 */
  .fabs { right: 10px; bottom: 10px; gap: 8px; }
  .fab-toggle { width: 44px; height: 44px; }
  .fabs-panel { width: min(320px, calc(100vw - 20px)); }
  .toasts { left: 10px; right: 10px; bottom: 10px; }
  .scrim { padding: 10px; align-items: end; }
  .modal { width: 100%; max-height: 90dvh; }
  .drawer { width: 100%; }
  .modal-foot, .drawer-foot { flex-wrap: wrap; }
  .modal-foot .btn, .drawer-foot .btn { flex: 1 1 auto; justify-content: center; }

  /* 触控目标：手机端不小于 44px */
  .btn { min-height: 40px; }
  .iconbtn { min-width: 40px; min-height: 40px; }
  .nav-item { min-height: 42px; padding-top: 9px; padding-bottom: 9px; }
  .nav-sub .nav-item { min-height: 38px; padding-top: 7px; padding-bottom: 7px; }
  .rc-item { min-height: 44px; }
  .m-tab { min-height: 48px; }
  .endswitch button { min-height: 32px; }

  /* 表格：保证列宽可读，容器内横滚 */
  .table { min-width: 560px; }
  .wb-foot, .keybar { flex-wrap: wrap; }
  .keybar { gap: 6px; font-size: var(--fs-11); }
  .panel-foot { flex-wrap: wrap; }
  .detail-split { gap: 10px; }

  /* 播放器与时间轴在窄屏收紧 */
  .g-2 { grid-template-columns: minmax(0,1fr); }
  .timeline .tl-ruler { font-size: 9px; }
  .transport { gap: 6px; padding: 7px 8px; }
  .transport .tc { font-size: var(--fs-11); }
  .transport input[type="range"] { min-width: 96px; }
  .timeline { padding: 8px 10px 10px; }
  .track { grid-template-columns: 72px minmax(0,1fr); gap: 7px; }
  .track-label { font-size: 10px; gap: 4px; }
}
